version: 2
models:
  - name: stg_customers
    description: Synthetic customer versions; one version per customer and effective date.
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: latest_update
        data_tests: [not_null]
  - name: stg_currency_exchange
    description: EUR per one native-currency unit on a calendar date.
    columns:
      - name: base_rate_euro
        data_tests: [not_null]
  - name: stg_transactions
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: tx_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [DEPOSIT, WITHDRAWAL]
  - name: int_customer_history
    description: Half-open effective-date history; duplicate same-day updates are invalid.
    columns:
      - name: valid_from_date
        data_tests: [not_null]
      - name: valid_to_date
        data_tests: [not_null]
  - name: int_transactions_converted
    columns:
      - name: amount_eur
        data_tests: [not_null]
  - name: dim_customers
    description: Latest known synthetic customer state.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: country
        data_tests: [not_null]
      - name: state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [VALIDATED, SIGNUP, INACTIVE]
      - name: latest_update
        data_tests: [not_null]
  - name: fct_transactions
    description: Daily EUR movements and cumulative net movement per customer and account; opening balance assumed zero.
    columns:
      - name: date
        data_tests: [not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: account_type
        data_tests: [not_null]
      - name: country
        data_tests: [not_null]
      - name: deposit
        data_tests: [not_null]
      - name: withdrawal
        data_tests: [not_null]
      - name: balance
        data_tests: [not_null]
