    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
seeds:
  customer_analytics:
    raw_currency_exchange:
      +column_types:
        baseRateEuro: decimal(30,15)
    raw_transactions:
      +column_types:
        amount: decimal(30,15)
