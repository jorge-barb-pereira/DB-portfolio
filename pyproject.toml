[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-databases-portfolio"
version = "0.1.0"
description = "PostgreSQL/PostGIS election analytics and SQLite healthcare database coursework"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0,<4", "psycopg2-binary>=2.9.9,<3", "python-dotenv>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
election_portfolio = ["templates/*.html"]
