name: Election analytics checks
on:
  push:
    paths: ['projects/election-analytics/**', '.github/workflows/elections.yml']
  pull_request:
    paths: ['projects/election-analytics/**', '.github/workflows/elections.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/election-analytics
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: projects/election-analytics/requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m election_portfolio.etl validate
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: portfolio_test
      DB_USER: portfolio
      DB_PASS: ci-only-test-password
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
