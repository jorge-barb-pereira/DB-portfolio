name: Healthcare database checks
on:
  push:
    paths: ['projects/healthcare-db/**', '.github/workflows/healthcare.yml']
  pull_request:
    paths: ['projects/healthcare-db/**', '.github/workflows/healthcare.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/healthcare-db
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python demo.py
